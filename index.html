<!doctype html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Comment le cerveau perçoit le temps</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: black;
        overflow: hidden;
        color: white;
        font-family: Arial, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        cursor: pointer;
      }

      #instructions {
        position: fixed;
        top: max(20px, env(safe-area-inset-top));
        left: max(20px, env(safe-area-inset-left));
        right: max(20px, env(safe-area-inset-right));
        z-index: 10;

        font-size: clamp(14px, 4vw, 18px);
        line-height: 1.5;
      }

      #counter {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;

        font-size: clamp(40px, 12vw, 64px);
        font-weight: bold;
        pointer-events: none;
      }

      #flash {
        position: fixed;
        inset: 0;
        background: white;
        opacity: 0;
        pointer-events: none;
        z-index: 20;
      }

      .mobile-only {
        display: none;
      }

      @media (max-width: 699px) {
        .desktop-only {
          display: none;
        }

        .mobile-only {
          display: inline;
        }
      }
    </style>
  </head>

  <body>
    <div id="instructions">
      Appuie sur <strong>A</strong> ou tape l'écran pour que l'écran clignote
      blanc.<br />

      Regarde le milieu de l'écran.<br />
      Appuie environ à chaque seconde.<br />
      Le 21e clignotement surviendra juste avant que tu appuies.
    </div>

    <div id="counter">0</div>

    <div id="flash"></div>

    <script>
      const flash = document.getElementById("flash");
      const counter = document.getElementById("counter");

      const FLASH_DURATION = 50;
      const DELAY_STEP = 10;
      const MAX_DELAY = 190;

      let delay = 0;
      let flashCount = 0;

      function triggerFlash() {
        const currentDelay = delay;

        delay += DELAY_STEP;

        if (delay > MAX_DELAY) {
          delay = 0;
        }

        setTimeout(() => {
          flashCount++;

          if (flashCount === 21) {
            flashCount = 1;
          }

          counter.textContent = flashCount;

          flash.style.opacity = "1";

          setTimeout(() => {
            flash.style.opacity = "0";
          }, FLASH_DURATION);
        }, currentDelay);
      }

      // Desktop: press A
      document.addEventListener("keydown", function (event) {
        if (event.key.toLowerCase() !== "a") {
          return;
        }

        triggerFlash();
      });

      // Mobile and desktop: tap/click anywhere
      document.addEventListener("pointerdown", function (event) {
        // Don't trigger twice from keyboard-generated pointer events
        if (event.pointerType === "mouse" && event.button !== 0) {
          return;
        }

        triggerFlash();
      });
    </script>
  </body>
</html>
