<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comment le cerveau perçoit le temps</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: black;
        overflow: hidden;
        color: white;
      }

      #instructions {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 10;
      }

      #counter {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;

        font-size: 48px;
        font-weight: bold;
      }

      #flash {
        position: fixed;
        inset: 0;
        background: white;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="instructions">
      Appuie sur A pour que l'écran clignote blanc.<br />
      Regarde le milieu de l'écran.<br />
      Appuie environ à chaque demi-seconde.<br />
      Le 21e clignotement surviendra juste avant que tu appuies sur la touche A.
    </div>

    <div id="counter">0</div>

    <div id="flash"></div>

    <script>
      const flash = document.getElementById("flash");
      const counter = document.getElementById("counter");

      const FLASH_DURATION = 50;
      const DELAY_STEP = 10;
      const MAX_DELAY = 190;

      let delay = 0;
      let flashCount = 0;

      document.addEventListener("keydown", function (event) {
        // Only react to the A key
        if (event.key.toLowerCase() !== "a") {
          return;
        }

        // Capture the current delay for this key press
        const currentDelay = delay;

        // Increase delay for the next press
        delay += DELAY_STEP;

        // After 200ms, the next press starts again at 0ms
        if (delay > MAX_DELAY) {
          delay = 0;
        }

        // Schedule the flash
        setTimeout(() => {
          // Count the flash
          flashCount++;
          if (flashCount == 21) flashCount = 1;
          counter.textContent = flashCount;

          // Flash white
          flash.style.opacity = "1";

          setTimeout(() => {
            flash.style.opacity = "0";
          }, FLASH_DURATION);
        }, currentDelay);
      });
    </script>
  </body>
</html>
